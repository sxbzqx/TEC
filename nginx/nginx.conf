worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 1. Редирект с HTTP (80) на HTTPS (443)
    server {
        listen       80;
        listen       [::]:80;
        server_name  btec.kg 10.0.4.37 localhost;

        return 301 https://$host$request_uri;
    }

    # 2. Основной защищенный сервер HTTPS (443)
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  btec.kg 10.0.4.37 localhost;

        # Сертификаты монтируются внутрь контейнера из ./nginx/certs
        ssl_certificate      /etc/nginx/certs/btec.kg+4.pem;
        ssl_certificate_key  /etc/nginx/certs/btec.kg.pem;

        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Фронтенд Next.js (контейнер tec_client)
        location / {
            proxy_pass http://tec_client:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Бэкенд C# API (алиас /api-backend/) — единственный прямой путь к бэкенду.
        # /api/ намеренно НЕ проксируется напрямую: под этим префиксом
        # живут собственные Route Handlers Next.js (/api/auth/login и т.д.),
        # которые выставляют httpOnly-куки. Прямой /api/ location перехватывал
        # бы эти запросы раньше, чем они доходили до tec_client.
        location /api-backend/ {
            rewrite ^/api-backend/(.*)$ /api/$1 break;

            proxy_pass http://tec_api:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}