worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 1. Редирект с HTTP (80) на HTTPS (443)
    server {
        listen       80;
        listen       [::]:80;
        server_name  btec.kg 10.0.4.37 localhost;

        return 301 https://$host$request_uri;
    }

    # 2. Основной защищенный сервер HTTPS (443)
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  btec.kg 10.0.4.37 localhost;

        # Сертификаты монтируются внутрь контейнера из ./nginx/certs
        ssl_certificate      /etc/nginx/certs/btec.kg+4.pem;
        ssl_certificate_key  /etc/nginx/certs/btec.kg.pem;

        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Фронтенд Next.js (контейнер tec_client)
        location / {
            proxy_pass http://tec_client:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Бэкенд C# API напрямую под своими "родными" путями (/api/Workers,
        # /api/Documents, /api/swagger и т.д.) — КРОМЕ /api/auth/, это по-прежнему
        # роуты Next.js (app/api/auth/*), которые выставляют httpOnly-куки.
        # ВАЖНО: сравнение регистрозависимое (~, не ~*) — реальные вызовы фронта
        # всегда идут строго "api/auth/..." (папка в Next.js, маленькими буквами),
        # а бэкенд генерирует пути строго "api/Auth/..." (от имени AuthController,
        # с большой буквы). С ~* эти два пути ложно совпадали, и например
        # /api/Auth/me бэкенда тоже улетал в Next.js вместо бэкенда.
        location ~ ^/api/(?!auth/) {
            proxy_pass http://tec_api:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Бэкенд C# API (алиас /api-backend/) — путь, которым пользуется сам
        # фронтенд (NEXT_PUBLIC_API_URL). Оставлен для обратной совместимости —
        # ведёт туда же, куда и правило выше.
        location /api-backend/ {
            rewrite ^/api-backend/(.*)$ /api/$1 break;

            proxy_pass http://tec_api:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}